name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
          make lint
          make test

      - name: Build official release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${VERSION#v}"
          ldflags="-s -w -X kube-sre-mcp/internal/version.Version=${VERSION}"
          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "Building ${out}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="${ldflags}" -o "dist/${out}" ./cmd/kube-sre-mcp
          }
          build linux amd64 kube-sre-mcp-linux-amd64
          build linux arm64 kube-sre-mcp-linux-arm64
          build darwin amd64 kube-sre-mcp-darwin-amd64
          build darwin arm64 kube-sre-mcp-darwin-arm64
          build windows amd64 kube-sre-mcp-windows-amd64.exe
          (
            cd dist
            sha256sum kube-sre-mcp-linux-amd64 \
              kube-sre-mcp-linux-arm64 \
              kube-sre-mcp-darwin-amd64 \
              kube-sre-mcp-darwin-arm64 \
              kube-sre-mcp-windows-amd64.exe > checksums.txt
          )

      # Create a draft, attach every asset, then publish. GitHub immutable
      # releases reject asset uploads after a release is public. The previous
      # softprops/action-gh-release path created the release then uploaded in
      # parallel, which failed with "Error creating asset temp dir".
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          assets=(
            dist/kube-sre-mcp-linux-amd64
            dist/kube-sre-mcp-linux-arm64
            dist/kube-sre-mcp-darwin-amd64
            dist/kube-sre-mcp-darwin-arm64
            dist/kube-sre-mcp-windows-amd64.exe
            dist/checksums.txt
          )
          for f in "${assets[@]}"; do
            test -f "$f"
          done

          extra=()
          case "$tag" in
            *-alpha*|*-beta*|*-rc*) extra+=(--prerelease) ;;
          esac

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == "true" ]]; then
              echo "Removing leftover draft release ${tag} from a previous run"
              gh release delete "$tag" --yes
            else
              echo "Published release ${tag} already exists; immutable releases cannot replace its assets." >&2
              echo "Delete that GitHub Release (if allowed) or cut a new tag." >&2
              exit 1
            fi
          fi

          gh release create "$tag" \
            --draft \
            --verify-tag \
            --generate-notes \
            "${extra[@]}" \
            "${assets[@]}"
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json url,isDraft,isPrerelease,tagName
