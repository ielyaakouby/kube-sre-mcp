name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum
          make lint
          make test

      - name: Build official release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="${VERSION#v}"
          ldflags="-s -w -X kube-sre-mcp/internal/version.Version=${VERSION}"
          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "Building ${out}"
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags="${ldflags}" -o "dist/${out}" ./cmd/kube-sre-mcp
          }
          build linux amd64 kube-sre-mcp-linux-amd64
          build linux arm64 kube-sre-mcp-linux-arm64
          build darwin amd64 kube-sre-mcp-darwin-amd64
          build darwin arm64 kube-sre-mcp-darwin-arm64
          build windows amd64 kube-sre-mcp-windows-amd64.exe
          (
            cd dist
            sha256sum kube-sre-mcp-linux-amd64 \
              kube-sre-mcp-linux-arm64 \
              kube-sre-mcp-darwin-amd64 \
              kube-sre-mcp-darwin-arm64 \
              kube-sre-mcp-windows-amd64.exe > checksums.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/kube-sre-mcp-linux-amd64
            dist/kube-sre-mcp-linux-arm64
            dist/kube-sre-mcp-darwin-amd64
            dist/kube-sre-mcp-darwin-arm64
            dist/kube-sre-mcp-windows-amd64.exe
            dist/checksums.txt
